/* admin */
const get=p=>p.split(".").reduce((o,k)=>o&&o[k],S);
function setP(p,v){const k=p.split("."),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v}
const fld=(p,l,m)=>`<label>${l}</label>`+(m?`<textarea rows="${m}" data-p="${p}" dir="auto">${esc(get(p)||"")}</textarea>`:`<input data-p="${p}" dir="auto" value="${esc(get(p)||"")}">`);
const bi=(p,l,m)=>`<div class="two"><div>${fld(p+".en",l+" (EN)",m)}</div><div>${fld(p+".fa",l+" (FA)",m)}</div></div>`;
const del=(p,i,t)=>`<button class="btn d" data-act="del" data-path="${p}" data-i="${i}">${t||"✕"}</button>`;
function renderAdmin(){let b="";
if(adTab=="profile")b=`<div class="ad"><h3>Profile</h3>${bi("name","Name")}${bi("footer","Footer")}</div><div class="ad"><h3>Typing roles</h3>${S.roles.map((r,i)=>bi("roles."+i,"Role "+(i+1))+del("roles",i)).join("")}<br><button class="btn" data-act="add" data-path="roles" data-tpl='{"en":"","fa":""}'>+ role</button></div><div class="ad"><h3>Stats</h3>${S.stats.map((s,i)=>fld(`stats.${i}.n`,"Number")+bi(`stats.${i}.l`,"Label")+del("stats",i)).join("")}<br><button class="btn" data-act="add" data-path="stats" data-tpl='{"n":0,"l":{"en":"","fa":""}}'>+ stat</button></div><div class="ad"><h3>Contact (links)</h3>${Object.keys(S.contact).map(k=>fld("contact."+k,lab(k))).join("")}</div>`;
if(adTab=="sections")b=S.sections.map((s,i)=>`<div class="ad"><h3>${s.icon||""} ${esc(tx(s.title))} · ${s.track}</h3><div class="two"><div><label>Resume</label><select data-p="sections.${i}.track">${[["net","Network"],["work","Product & Work"]].map(o=>`<option value="${o[0]}" ${s.track==o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></div><div><label>Style</label><select data-p="sections.${i}.kind">${["text","chips","cards","timeline"].map(k=>`<option ${s.kind==k?"selected":""}>${k}</option>`).join("")}</select></div></div>${fld(`sections.${i}.icon`,"Emoji icon")}${bi(`sections.${i}.title`,"Title")}${s.items.map((it,j)=>`<div class="it">${s.kind!="text"?bi(`sections.${i}.items.${j}.t`,"Title"):""}${s.kind=="cards"||s.kind=="timeline"?bi(`sections.${i}.items.${j}.meta`,"Subtitle"):""}${s.kind!="chips"?bi(`sections.${i}.items.${j}.d`,"Text",5):""}${del(`sections.${i}.items`,j,"✕ item")}</div>`).join("")}<br><button class="btn" data-act="add" data-path="sections.${i}.items" data-tpl='{"t":{"en":"","fa":""},"meta":{"en":"","fa":""},"d":{"en":"","fa":""}}'>+ item</button> ${del("sections",i,"delete section")}</div>`).join("")+`<button class="btn" data-act="add" data-path="sections" data-tpl='{"id":"s${Date.now()}","icon":"✨","track":"work","kind":"cards","title":{"en":"New section","fa":"بخش جدید"},"items":[]}'>+ section</button>`;
if(adTab=="posts")b=S.posts.map((p,i)=>`<div class="ad"><h3>${esc(tx(p.title))||"New post"}</h3>${fld(`posts.${i}.date`,"Date (YYYY-MM-DD)")}${bi(`posts.${i}.title`,"Title")}${bi(`posts.${i}.body`,"Body",6)}<br>${del("posts",i,"delete post")}</div>`).join("")+`<button class="btn" data-act="add" data-path="posts" data-tpl='{"id":"","date":"${new Date().toISOString().slice(0,10)}","title":{"en":"","fa":""},"body":{"en":"","fa":""}}'>+ post</button>`;
$("#admin").innerHTML=bar(["profile","sections","posts"].map(t=>`<button class="btn ${adTab==t?"on":""}" data-tab="${t}">${t}</button>`).join("")+`<button class="btn" id="save">${dirty?"● Save & publish":"Publish"}</button>`)+`<div class="wrap" dir="ltr"><div class="hero" style="padding-top:20px"><h2>Admin panel</h2></div><p style="color:var(--mut)">Edit, then press Publish. Everyone sees the new version after it saves.</p>${b}</div>`}
async function publish(){const A=await claude.use("artifact");if(!A){alert("Publishing is not available here.");return}
const c=document.documentElement.cloneNode(true);c.querySelector("#data").textContent=JSON.stringify(S).replace(/</g,"\\u003c");
["land","resume","blog","admin"].forEach(i=>{const e=c.querySelector("#"+i);e.innerHTML="";e.className=i=="land"?"":"hide"});c.querySelector("#login").className="hide";c.querySelector("#terminal").className="hide";c.querySelector("#out").innerHTML="";c.querySelector("#pw").removeAttribute("value");c.removeAttribute("dir");
try{await A.publish("<!DOCTYPE html>\n"+c.outerHTML)}catch(e){alert("Could not publish: "+(e.code||e.message))}}
function apply(){document.documentElement.lang=L;document.documentElement.dir=L=="fa"?"rtl":"ltr";document.querySelectorAll("[data-lang]").forEach(b=>b.textContent=other());renderLand();renderResume();renderBlog();renderAdmin()}
function go(v){v=v||"";if(v=="admin"&&!adminOK)v="login";["land","resume","blog","admin","login","terminal"].forEach(x=>$("#"+x).classList.toggle("hide",x!=(v||"land")));scrollTo(0,0);if(v=="terminal")boot();if(v=="resume"){typeRole();count()}if(v=="login")setTimeout(()=>$("#pw").focus(),50);try{history.replaceState(null,"","#"+(v=="login"||v=="admin"?"":v))}catch(e){}}
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function login(){const p=$("#pw").value;$("#pw").value="";if(await sha(p)===PH){adminOK=true;$("#lerr").textContent="";renderAdmin();go("admin")}else{$("#lerr").textContent="Wrong password."}}
$("#lg").addEventListener("click",login);$("#pw").addEventListener("keydown",e=>{if(e.key=="Enter")login()});
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
if(t.dataset.go!==undefined)go(t.dataset.go);
else if(t.dataset.lang!==undefined){L=L=="en"?"fa":"en";try{localStorage.setItem("lang",L)}catch(x){}const h=location.hash.slice(1);apply();go(adminOK&&!$("#admin").classList.contains("hide")?"admin":h)}
else if(t.dataset.track){track=t.dataset.track;renderResume()}
else if(t.dataset.tab){adTab=t.dataset.tab;renderAdmin()}
else if(t.dataset.act){const a=get(t.dataset.path);if(t.dataset.act=="del")a.splice(+t.dataset.i,1);else{const n=JSON.parse(t.dataset.tpl);if(n.id==="")n.id="p"+Date.now();a.push(n)}dirty=true;renderAdmin();renderResume();renderBlog()}
else if(t.id=="save"){publish()}});
document.addEventListener("change",e=>{if(e.target.matches("select[data-p]")){setP(e.target.dataset.p,e.target.value);dirty=true;renderAdmin();renderResume()}});
document.addEventListener("input",e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p)return;setP(p,e.target.value);if(!dirty){dirty=true;const s=$("#save");if(s)s.textContent="● Save & publish"}clearTimeout(tAI);tAI=setTimeout(()=>{renderResume();renderBlog()},400)});
/* terminal */
const out=$("#out"),cmd=$("#cmd");let hist=[],hi=0;
function pr(h,c){const d=document.createElement("div");if(c)d.className=c;d.innerHTML=h;out.appendChild(d);out.scrollTop=out.scrollHeight}
function boot(){if(out.childElementCount)return;C.neofetch();pr(`\nType <span class="p">help</span> to see commands.`,"m");setTimeout(()=>cmd.focus(),50)}
const AL={exp:"jobs",experience:"jobs",work:"jobs",projects:"practice",cisco:"adv",education:"courses",devops:"pd",skill:"skills"};
function show(s){pr(`<span class="p">## ${s.icon||""} ${esc(tx(s.title))}</span>`);const it=s.items||[];
if(s.kind=="chips")pr(esc(it.map(i=>tx(i.t)).join(" · ")));
else if(s.kind=="text")it.forEach(i=>pr(esc(tx(i.d))+"\n"));
else it.forEach(i=>pr(`<span class="p">▸ ${esc(tx(i.t))}</span>${i.meta?` <span class="m">[${esc(tx(i.meta))}]</span>`:""}${i.d?"\n"+esc(tx(i.d)):""}\n`))}
const C={help(){pr("<span class=\"p\">Resume sections</span>");S.sections.forEach(s=>pr(`  <span class="p">${esc(s.id.padEnd(11))}</span><span class="m">${s.track=="net"?"[net] ":"[work] "}${esc(tx(s.title))}</span>`));pr("<span class=\"p\">Other</span>");[["whoami","name and roles"],["resume","print everything"],["contact","social links"],["blog","posts"],["neofetch","system info"],["ping","ping the lab server"],["lang fa|en","switch language"],["clear","clear screen"],["exit","back to menu"]].forEach(c=>pr(`  <span class="p">${c[0].padEnd(11)}</span><span class="m">${c[1]}</span>`))},
whoami(){pr(`${esc(tx(S.name))}\n`+S.roles.map(r=>"• "+esc(tx(r))).join("\n")+"\n"+S.stats.map(s=>esc(num(s.n))+" "+esc(tx(s.l))).join(" · "))},
resume(){S.sections.forEach(show)},
contact(){const k=Object.entries(S.contact).filter(e=>e[1]);pr(k.map(([a,b])=>`<span class="p">${lab(a).padEnd(10)}</span><a target="_blank" rel="noopener" href="${esc(href(a,b))}">${esc(b.replace(/\?.*/,""))}</a>`).join("\n"))},
blog(){S.posts.forEach(p=>pr(`<span class="p">${esc(p.date)}</span> ${esc(tx(p.title))}\n<span class="m">${esc(tx(p.body))}</span>\n`))},
neofetch(){pr(`<span class="p">   ┌─[■]─┐   </span>${esc(tx(S.name))}@lab\n<span class="p">   │ ▓▓▓ │   </span>──────────\n<span class="p">   ├─────┤   </span>Role: Product + IT & Network\n<span class="p">   │ ▓▓▓ │   </span>Stack: Cisco, MikroTik, VMware, Windows Server\n<span class="p">   └─────┘   </span>Uni: Shahrekord University\n              Uptime: always learning`)},
ping(){let n=0;pr("Pinging lab.local with 32 bytes:");const t=setInterval(()=>{pr(`Reply from 10.0.0.1: bytes=32 time=${1+Math.floor(Math.random()*4)}ms TTL=128`);if(++n==4){clearInterval(t);pr("Sent = 4, Received = 4, Lost = 0 (0% loss)","m")}},450)},
lang(a){if(a=="fa"||a=="en"){L=a;apply();go("terminal");pr("ok","m")}else pr("usage: lang fa|en")},clear(){out.innerHTML=""},exit(){go("")}};
function run(v){const[c0,...a]=v.split(/\s+/),c=c0.toLowerCase();
if(c=="admin"){pr("Opening secure login…","m");setTimeout(()=>go("login"),350);return}
if(Object.hasOwn(C,c)){C[c](a[0]);return}
const id=AL[c]||c,s=S.sections.find(x=>x.id==id);s?show(s):pr(`${esc(c0)}: command not found. Try help`,"m")}
cmd.addEventListener("keydown",e=>{if(e.key=="Enter"){const v=cmd.value.trim();cmd.value="";if(!v)return;hist.push(v);hi=hist.length;pr(`<span class="p">arian@lab:~$</span> ${esc(v)}`);run(v)}
else if(e.key=="Tab"){e.preventDefault();const v=cmd.value.toLowerCase(),all=[...Object.keys(C),...S.sections.map(s=>s.id),...Object.keys(AL)],m=all.filter(k=>k.startsWith(v));if(m.length==1)cmd.value=m[0];else if(m.length)pr(m.join("  "),"m")}
else if(e.key=="ArrowUp"){e.preventDefault();if(hi>0)cmd.value=hist[--hi]}
else if(e.key=="ArrowDown"){e.preventDefault();cmd.value=hist[++hi]||"";hi=Math.min(hi,hist.length)}});
$("#terminal").addEventListener("click",e=>{if(!e.target.closest("button")&&!getSelection().toString())cmd.focus()});
/* background */
const cv=$("#bg"),cx=cv.getContext("2d");let N=[],W,H;
function sz(){W=cv.width=innerWidth;H=cv.height=innerHeight;N=Array.from({length:Math.min(55,Math.floor(W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35}))}
function draw(){cx.clearRect(0,0,W,H);N.forEach((a,i)=>{a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;cx.fillStyle="#d8454b";cx.beginPath();cx.arc(a.x,a.y,1.8,0,7);cx.fill();for(let j=i+1;j<N.length;j++){const b=N[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<140){cx.strokeStyle=`rgba(216,69,75,${.28*(1-d/140)})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}}});requestAnimationFrame(draw)}
addEventListener("resize",sz);sz();draw();
apply();const h0=location.hash.slice(1);go(["terminal","resume","blog"].includes(h0)?h0:"");
</script></body></html>
